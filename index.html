      <script>
  (function () {
    // ========================================
    // LAYER 1: Keyboard shortcut prevention
    // ========================================
    document.addEventListener('keydown', function (e) {
      var key = e.key ? e.key.toUpperCase() : '';
      var blocked =
        key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(key)) ||
        (e.ctrlKey && key === 'U') ||
        (e.ctrlKey && key === 'S') ||
        (e.ctrlKey && key === 'P') ||
        (e.ctrlKey && key === 'A') ||
        (e.ctrlKey && key === 'C') ||
        (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(key)) ||
        (e.ctrlKey && e.shiftKey && key === 'R');
      if (blocked) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);

    // ========================================
    // LAYER 2: Context menu, drag, selection, copy/cut prevention
    // ========================================
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
    document.addEventListener('dragstart', function(e) { e.preventDefault(); }, true);
    document.addEventListener('selectstart', function(e) { e.preventDefault(); }, true);
    document.addEventListener('copy', function(e) { e.preventDefault(); }, true);
    document.addEventListener('cut', function(e) { e.preventDefault(); }, true);

    // ========================================
    // LAYER 3: Console warnings
    // ========================================
    console.log("%cSTOP!", "color: red; font-family: sans-serif; font-size: 60px; font-weight: bold; text-shadow: 1px 1px 3px black;");
    console.log("%cPrivate property of Pacifico Oyanib III. Do not touch.", "color: white; background: #cc0000; font-size: 16px; padding: 6px 12px; font-weight: bold; border-radius: 4px;");
    console.warn("%cWARNING: This console is a restricted developer environment.\n\nUnauthorized access, system tampering, reverse engineering, or data interference is strictly prohibited. Any malicious activity targeting this application may be subject to criminal prosecution under the Philippine Cybercrime Prevention Act of 2012 (Republic Act No. 10175).\n\nIf you were told to copy and paste something here, it is likely a scam that will give attackers access to your account. Close this window immediately.", "color: #ffaa00; font-size: 14px; font-weight: bold; line-height: 1.5;");

    // ========================================
    // DEVTOOLS DETECTION ENGINE
    // Catches DevTools opened BEFORE or AFTER page load
    // ========================================
    var _devtoolsOpen = false;

    function onDevToolsDetected() {
      if (_devtoolsOpen) return;
      _devtoolsOpen = true;

      // Nuke page content
      try {
        document.documentElement.innerHTML = '';
      } catch(e) {}
      document.close();
    }

    function resetDetection() {
      _devtoolsOpen = false;
    }

    // ----------------------------------------
    // DETECTION METHOD 1: Debugger timing trap
    // When DevTools is open, the debugger statement pauses execution,
    // causing measurable delay. This works even if DevTools was opened
    // BEFORE the page loaded.
    // ----------------------------------------
    function debuggerTimingCheck() {
      var start = performance.now();
      // This debugger statement will pause if DevTools is open
      (function(){}).constructor('debugger')();
      var elapsed = performance.now() - start;
      // If execution took >100ms, DevTools is intercepting
      if (elapsed > 100) {
        onDevToolsDetected();
      }
    }

    // ----------------------------------------
    // DETECTION METHOD 2: Window size differential
    // Detects docked DevTools panels
    // ----------------------------------------
    function sizeCheck() {
      var threshold = 160;
      var widthDiff = window.outerWidth - window.innerWidth;
      var heightDiff = window.outerHeight - window.innerHeight;
      if (widthDiff > threshold || heightDiff > threshold) {
        onDevToolsDetected();
      }
    }

    // ----------------------------------------
    // DETECTION METHOD 3: Console object toString trap
    // DevTools calls toString() on objects logged to console.
    // We create a trap object that detects this.
    // ----------------------------------------
    function consoleProbeCheck() {
      var _trap = new Image();
      Object.defineProperty(_trap, 'id', {
        get: function() {
          onDevToolsDetected();
          return '';
        }
      });
      // Regularly push the trap to console — DevTools will read its properties
      console.debug('%c', _trap);
    }

    // ----------------------------------------
    // DETECTION METHOD 4: Element inspection trap
    // When DevTools inspects DOM elements, it accesses certain getters.
    // ----------------------------------------
    function elementInspectTrap() {
      var _el = document.createElement('div');
      Object.defineProperty(_el, 'id', {
        get: function() {
          onDevToolsDetected();
          return 'devtools-trap';
        },
        configurable: true
      });
      // Log element — DevTools reads its properties when inspecting
      console.debug(_el);
    }

    // ========================================
    // RUN ALL DETECTION CHECKS
    // ========================================

    // Immediate checks on page load (catches pre-opened DevTools)
    try { debuggerTimingCheck(); } catch(e) {}
    try { sizeCheck(); } catch(e) {}
    try { consoleProbeCheck(); } catch(e) {}
    try { elementInspectTrap(); } catch(e) {}

    // Continuous monitoring (catches DevTools opened after page load)
    setInterval(function() {
      try { debuggerTimingCheck(); } catch(e) {}
      try { sizeCheck(); } catch(e) {}
      try { consoleProbeCheck(); } catch(e) {}
    }, 500);

    // Re-run element trap periodically
    setInterval(function() {
      try { elementInspectTrap(); } catch(e) {}
    }, 2000);
  })();
</script>
